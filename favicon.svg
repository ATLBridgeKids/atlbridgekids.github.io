/* Atlanta Bridge Kids — mobile-first
   Palette: gold #B3A369, black #101010, navy #003057, white, warm off-white */

:root {
  --gold: #B3A369;
  --gold-deep: #8C7E4A;
  --black: #101010;
  --navy: #003057;
  --navy-deep: #001F3C;
  --paper: #FDFCF7;
  --ink: #1a1a1a;
  --muted: #5a5a5a;
  --rule: #e6e2d2;
  --heart: #C1272D;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, .display {
  font-family: "Fraunces", Georgia, "Times New Roman", serif;
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.15;
  margin: 0 0 0.5em;
}

h1 { font-size: 2.3rem; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.15rem; }

a { color: var(--navy); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { color: var(--gold-deep); }

/* ---------- Header ---------- */
.site-header {
  background: var(--black);
  color: #fff;
  border-bottom: 3px solid var(--gold);
}

.header-inner {
  max-width: 1000px;
  margin: 0 auto;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #fff;
  text-decoration: none;
  font-family: "Fraunces", Georgia, serif;
  font-weight: 600;
  font-size: 1.1rem;
  letter-spacing: 0.01em;
}
.brand:hover { color: var(--gold); }

.brand-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  background: var(--gold);
  color: var(--black);
  border-radius: 4px;
  font-size: 1.05rem;
  letter-spacing: -1px;
}

.brand-mark .heart { color: var(--heart); }

/* Nav — hamburger on mobile */
.nav-toggle {
  background: none;
  border: 1px solid rgba(255,255,255,0.4);
  color: #fff;
  width: 40px; height: 40px;
  border-radius: 4px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.nav-toggle:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.nav-toggle span,
.nav-toggle span::before,
.nav-toggle span::after {
  display: block;
  width: 18px;
  height: 2px;
  background: #fff;
  position: relative;
}
.nav-toggle span::before { content: ""; position: absolute; top: -6px; }
.nav-toggle span::after  { content: ""; position: absolute; top:  6px; }

.site-nav {
  display: none;
  background: var(--black);
  border-top: 1px solid rgba(255,255,255,0.08);
}
.site-nav.open { display: block; }
.site-nav ul {
  list-style: none;
  padding: 8px 20px 16px;
  margin: 0 auto;
  max-width: 1000px;
}
.site-nav li { border-bottom: 1px solid rgba(255,255,255,0.08); }
.site-nav li:last-child { border-bottom: 0; }
.site-nav a {
  display: block;
  padding: 14px 4px;
  color: #fff;
  text-decoration: none;
  font-size: 1rem;
  font-weight: 500;
}
.site-nav a[aria-current="page"] { color: var(--gold); }
.site-nav a:hover { color: var(--gold); }

@media (min-width: 720px) {
  .nav-toggle { display: none; }
  .site-nav { display: block; border-top: 0; background: transparent; }
  .header-inner { align-items: stretch; }
  .site-nav ul {
    display: flex;
    gap: 4px;
    padding: 0;
    align-items: center;
    height: 100%;
  }
  .site-nav li { border: 0; }
  .site-nav a { padding: 8px 12px; font-size: 0.95rem; }
}

/* ---------- Layout ---------- */
.wrap {
  max-width: 1000px;
  margin: 0 auto;
  padding: 24px 20px 64px;
}

.eyebrow {
  font-family: "Inter", sans-serif;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold-deep);
  margin-bottom: 8px;
}

.page-title {
  border-bottom: 1px solid var(--rule);
  padding-bottom: 16px;
  margin-bottom: 24px;
}
.page-title h1 { font-size: 2.6rem; margin-bottom: 4px; }
.page-title p { color: var(--muted); margin: 0; }
@media (min-width: 720px) {
  .page-title h1 { font-size: 3.2rem; }
}

/* ---------- Hero (home) ---------- */
.hero {
  background: var(--black);
  color: #fff;
  padding: 40px 20px 32px;
  border-bottom: 4px solid var(--gold);
  position: relative;
  overflow: hidden;
}
.hero-inner {
  max-width: 1000px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}
.hero .eyebrow { color: var(--gold); }
.hero h1 {
  font-size: 3.1rem;
  margin-bottom: 12px;
}
.hero p {
  max-width: 55ch;
  color: rgba(255,255,255,0.85);
  margin: 0 0 20px;
}
.hero-suits {
  position: absolute;
  right: -30px;
  top: -20px;
  font-size: 260px;
  line-height: 1;
  color: var(--gold);
  opacity: 0.07;
  font-family: "Fraunces", serif;
  pointer-events: none;
  user-select: none;
}
@media (min-width: 720px) {
  .hero { padding: 64px 20px 56px; }
  .hero h1 { font-size: 4.4rem; }
  .hero-suits { font-size: 380px; right: -40px; }
}

/* ---------- Next event highlight ---------- */
.quick-nav {
  display: flex;
  gap: 8px;
  margin: 20px 0 0;
  flex-wrap: wrap;
}
.quick-nav a {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border: 1px solid var(--rule);
  border-radius: 20px;
  background: #fff;
  color: var(--navy);
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 600;
}
.quick-nav a::after { content: "↓"; color: var(--gold-deep); font-weight: 400; }
.quick-nav a:hover { border-color: var(--gold); color: var(--gold-deep); }

.section-head, #upcoming, #past {
  scroll-margin-top: 20px;
}

.next-event {
  background: var(--navy);
  color: #fff;
  border-radius: 6px;
  padding: 20px;
  margin: 24px 0 32px;
  display: grid;
  gap: 8px;
}
.next-event.live {
  background: var(--gold);
  color: var(--black);
}
.next-event.live .eyebrow { color: var(--black); }
.next-event.live .eyebrow::before {
  content: "● "; color: var(--heart);
}
.next-event.live h2 { color: var(--black); }
.next-event.live .meta { color: rgba(0,0,0,0.7); }
.next-event .eyebrow { color: var(--gold); margin: 0; }
.next-event h2 {
  color: #fff;
  margin: 0;
  font-size: 1.4rem;
}
.next-event .meta { color: rgba(255,255,255,0.8); font-size: 0.95rem; }
.next-event .actions {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;
}
.next-event.live .btn-outline {
  color: var(--black);
  border-color: rgba(0,0,0,0.5);
}
.next-event.live .btn-outline:hover { border-color: var(--black); color: var(--black); background: rgba(0,0,0,0.06); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 12px 18px;
  border-radius: 4px;
  font-weight: 600;
  font-size: 0.95rem;
  text-decoration: none;
  border: 1px solid transparent;
  cursor: pointer;
  min-height: 44px;
  line-height: 1.2;
}
.btn-primary {
  background: var(--gold);
  color: var(--black);
  border-color: var(--gold);
}
.btn-primary:hover { background: var(--gold-deep); border-color: var(--gold-deep); color: var(--black); }

.btn-outline {
  background: transparent;
  color: #fff;
  border-color: rgba(255,255,255,0.6);
}
.btn-outline:hover { border-color: var(--gold); color: var(--gold); }

.btn-ghost {
  background: transparent;
  color: var(--navy);
  border-color: var(--navy);
}
.btn-ghost:hover { background: var(--navy); color: #fff; }

.btn-small { padding: 6px 10px; font-size: 0.8rem; min-height: 32px; }

/* ---------- Event cards ---------- */
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin: 22px 0 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--rule);
}
.section-head h2 { margin: 0; font-size: 1.3rem; }
.section-head .count { color: var(--muted); font-size: 0.8rem; }

.events-list {
  display: grid;
  gap: 8px;
}

.event-card {
  background: #fff;
  border: 1px solid var(--rule);
  border-left: 4px solid var(--gold);
  border-radius: 4px;
  padding: 12px 14px;
  display: grid;
  gap: 5px;
}
.event-card.past { border-left-color: #c9c4b0; opacity: 0.9; }

.event-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.event-date {
  font-family: "Fraunces", serif;
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--navy);
  white-space: nowrap;
}
.event-date .day { display: inline; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-family: "Inter", sans-serif; font-weight: 500; margin-right: 4px; }

.event-type {
  display: inline-block;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 3px 7px;
  border-radius: 3px;
  background: var(--gold);
  color: var(--black);
}
.event-type.lesson { background: var(--gold); }
.event-type.camp   { background: var(--navy); color: #fff; }
.event-type.play   { background: #e8e2c8; color: var(--black); }
.event-type.tournament { background: var(--black); color: var(--gold); }

.event-title { margin: 0; font-size: 1rem; }

.event-meta {
  color: var(--muted);
  font-size: 0.82rem;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
}

.event-counts {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 6px 10px;
  font-size: 0.8rem;
  color: var(--ink);
}
.event-counts strong { color: var(--navy); }
.event-counts .grades {
  color: var(--muted);
  margin-top: 2px;
  font-size: 0.78rem;
}

.event-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 2px;
}

.event-desc { color: var(--ink); margin: 0; font-size: 0.85rem; line-height: 1.4; }

.event-tags {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.live-tag {
  display: inline-flex;
  align-items: center;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--heart);
  white-space: nowrap;
}

.event-card.featured {
  background: #fffbee;
  border-color: var(--gold);
  border-left-width: 6px;
  box-shadow: 0 2px 10px rgba(179, 163, 105, 0.25);
}
.featured-tag {
  display: inline-block;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--gold-deep);
  white-space: nowrap;
}

.format-link {
  background: none;
  border: none;
  color: var(--navy);
  text-decoration: underline;
  text-underline-offset: 3px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  padding: 6px 4px;
}
.format-link:hover { color: var(--gold-deep); }

/* ---------- Format explainer modal ---------- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(16, 16, 16, 0.6);
  padding: 20px;
  z-index: 100;
}
.modal-overlay[hidden] { display: none; }
.modal-overlay:not([hidden]) { display: flex; align-items: center; justify-content: center; }
.modal-box {
  background: var(--paper);
  border-radius: 8px;
  padding: 24px;
  max-width: 440px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  position: relative;
  border-top: 4px solid var(--gold);
}
.modal-box h3 {
  margin: 0 0 12px;
  padding-right: 24px;
  font-size: 1.2rem;
  color: var(--navy);
}
.modal-box p { margin: 0 0 10px; font-size: 0.92rem; line-height: 1.5; }
.modal-box p:last-child { margin-bottom: 0; }
.modal-close {
  position: absolute;
  top: 14px;
  right: 14px;
  background: none;
  border: none;
  font-size: 1.5rem;
  line-height: 1;
  color: var(--muted);
  cursor: pointer;
  padding: 4px;
}
.modal-close:hover { color: var(--black); }

/* ---------- About page ---------- */
.about-grid {
  display: grid;
  gap: 24px;
}
@media (min-width: 720px) {
  .about-grid { grid-template-columns: 280px 1fr; gap: 40px; align-items: start; }
}
.about-photo {
  width: 100%;
  max-width: 280px;
  border-radius: 4px;
  border: 3px solid var(--gold);
  display: block;
}
.about-body p { margin: 0 0 1em; }

/* ---------- Directory ---------- */
.directory-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 0.92rem;
}
.directory-table th, .directory-table td {
  text-align: left;
  padding: 10px 8px;
  border-bottom: 1px solid var(--rule);
}
.directory-table th {
  background: var(--paper);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  font-weight: 600;
}
@media (max-width: 620px) {
  .directory-table thead { display: none; }
  .directory-table tr {
    display: block;
    border: 1px solid var(--rule);
    border-radius: 4px;
    margin-bottom: 12px;
    padding: 12px;
  }
  .directory-table td {
    display: flex;
    justify-content: space-between;
    border: 0;
    padding: 4px 0;
    gap: 12px;
  }
  .directory-table td::before {
    content: attr(data-label);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    font-weight: 600;
  }
}

/* ---------- Callouts ---------- */
.callout {
  background: #fff;
  border: 1px solid var(--rule);
  border-left: 4px solid var(--navy);
  border-radius: 3px;
  padding: 14px 16px;
  margin: 20px 0;
  font-size: 0.92rem;
}
.callout strong { color: var(--navy); }

.disclaimer-inline {
  font-size: 0.82rem;
  color: var(--muted);
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 10px 12px;
  margin: 16px 0;
}
.disclaimer-inline strong { color: var(--navy); }

.empty-state {
  border: 1px dashed var(--rule);
  border-radius: 4px;
  padding: 28px 20px;
  text-align: center;
  color: var(--muted);
  background: #fff;
}

.loading { color: var(--muted); font-style: italic; }

/* ---------- Donate ---------- */
.donate-grid {
  display: grid;
  gap: 12px;
  margin: 20px 0;
}
@media (min-width: 520px) {
  .donate-grid { grid-template-columns: repeat(2, 1fr); }
}
.donate-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #fff;
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 16px 18px;
  text-decoration: none;
  color: var(--ink);
  font-weight: 500;
}
.donate-btn:hover { border-color: var(--navy); color: var(--navy); }
.donate-btn .arrow { color: var(--gold-deep); font-size: 1.2rem; }

/* ---------- Resources ---------- */
.resource-placeholder {
  text-align: center;
  padding: 60px 20px;
  border: 1px dashed var(--rule);
  border-radius: 6px;
  color: var(--muted);
  background: #fff;
}
.resource-placeholder .icon {
  font-size: 3rem;
  color: var(--gold);
  margin-bottom: 12px;
}

.resource-list {
  display: grid;
  gap: 14px;
  margin: 20px 0;
}
.resource-card {
  background: #fff;
  border: 1px solid var(--rule);
  border-left: 4px solid var(--gold);
  border-radius: 4px;
  padding: 16px 18px;
}
.resource-card h3 { margin: 0 0 6px; font-size: 1.05rem; }
.resource-card h3 a {
  color: var(--navy);
  text-decoration: none;
}
.resource-card h3 a:hover { color: var(--gold-deep); text-decoration: underline; }
.resource-card h3 a::after {
  content: " ↗";
  font-size: 0.8rem;
  color: var(--gold-deep);
}
.resource-card p { margin: 0; color: var(--ink); font-size: 0.92rem; }

/* ---------- Footer ---------- */
.site-footer {
  background: var(--black);
  color: rgba(255,255,255,0.75);
  padding: 28px 20px;
  font-size: 0.85rem;
  margin-top: 40px;
}
.footer-inner {
  max-width: 1000px;
  margin: 0 auto;
  display: grid;
  gap: 14px;
}
.site-footer a { color: var(--gold); }
.site-footer .credit { color: rgba(255,255,255,0.55); font-size: 0.78rem; }

/* ---------- Utility ---------- */
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* Reduce motion */
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* Focus styles */
a:focus-visible, .btn:focus-visible, button:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}
